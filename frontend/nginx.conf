server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to a 1MB request body cap, which silently rejects any
    # real document upload (PDF/XLSX/DOCX) before it even reaches the
    # backend. Matches the backend's own MAX_UPLOAD_BYTES (20MB) plus a
    # little headroom so the backend's friendlier "fichier trop volumineux"
    # error is the one users actually see.
    client_max_body_size 25m;

    # The frontend never talks to Postgres, MinIO, Ollama or the MCP server
    # directly - everything goes through this single same-origin /api
    # prefix, proxied to the FastAPI backend inside the private network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
