server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to a 1MB request body cap, which silently rejects any
    # real document upload (PDF/XLSX/DOCX) before it even reaches the
    # backend. Matches the backend's own MAX_UPLOAD_BYTES (20MB) plus a
    # little headroom so the backend's friendlier "fichier trop volumineux"
    # error is the one users actually see.
    client_max_body_size 60m;

    # The frontend never talks to Postgres, MinIO, Ollama or the MCP server
    # directly - everything goes through this single same-origin /api
    # prefix, proxied to the FastAPI backend inside the private network.
    location /api/ {
        # Re-resolved through Docker's DNS every 10 s: a literal host in
        # proxy_pass is resolved once at nginx startup, so every backend
        # restart (new container IP) gave 502 until nginx was reloaded.
        # With a variable and no URI part, the request URI is passed as is
        # (/api/... -> /api/...), same as before.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full document report (read page batch by page batch by the local
        # model, then merged) can take several minutes on this machine.
        proxy_read_timeout 900s;
    }

    location / {
        try_files $uri /index.html;
    }
}
