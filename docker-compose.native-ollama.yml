# Optional overlay: use an Ollama instance already running natively on the
# host instead of the bundled `ollama` container - for EMBEDDINGS only
# (the RAG index, nomic-embed-text). The chat/generation model is the local
# Qwen3 GGUF served by the native llama-server (see start-orbit-ai.ps1);
# this overlay does not change that. Data never leaves this machine either way.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.native-ollama.yml up -d
#
# Adjust OLLAMA_EMBEDDING_MODEL below to whatever embedding model you already
# have pulled (`ollama list` on the host to check) - it must produce
# EMBEDDING_DIM-sized vectors (768 by default) or indexing will fail.

services:
  backend:
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp:
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  seed:
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
    extra_hosts:
      - "host.docker.internal:host-gateway"
